<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0d1b2a" />
<title>东旅记 · 手机版</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2a}
  .phone-shell{min-height:100dvh;display:flex;align-items:stretch;justify-content:center}
  .phone-frame{display:block;width:min(430px,100vw);height:100dvh;border:0;background:#fff;box-shadow:0 0 42px #0007}
  .boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;color:#17334c;font:16px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;transition:opacity .25s ease}
  .boot.done{opacity:0;pointer-events:none}
  .boot strong{font-size:24px;letter-spacing:.08em;color:#1555a0}.boot span{font-size:15px;color:#62768c}
  .boot-track{width:min(280px,72vw);height:8px;border-radius:999px;overflow:hidden;background:#dce8f4}
  .boot-track>i{display:block;height:100%;width:0;border-radius:inherit;background:#1555a0;animation:boot-progress 8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes boot-progress{0%{width:6%}20%{width:32%}55%{width:64%}100%{width:92%}}
  @media(prefers-reduced-motion:reduce){.boot-track>i{animation:none;width:70%}}
  @media(max-width:899px){.phone-frame{width:100%;box-shadow:none}}
</style>
</head>
<body>
<div class="phone-shell"><iframe id="app-frame" class="phone-frame" title="东旅记 · 手机版" allow="geolocation; clipboard-write; fullscreen"></iframe></div>
<div class="boot" id="boot"><strong>东旅记</strong><span>正在加载地图与足迹…</span><div class="boot-track"><i></i></div></div>
<script>
(function () {
  var frame = document.getElementById('app-frame'), boot = document.getElementById('boot');
  var params = new URLSearchParams(location.search);
  params.set('embed', '1');
  var src = './?' + params.toString() + (location.hash || '');
  var lastPosition = null, ready = false;
  function hideBoot() { if (!boot) return; boot.classList.add('done'); setTimeout(function () { boot.remove(); }, 300); }
  function sendPosition(position) { frame.contentWindow && frame.contentWindow.postMessage({ type: 'donglvji:location', position: position }, location.origin); }
  function remember(position) { lastPosition = position; sendPosition(position); }
  function read(fix) {
    var coords = fix && fix.coords;
    if (!coords || !Number.isFinite(coords.latitude) || !Number.isFinite(coords.longitude)) return;
    remember({ latitude: coords.latitude, longitude: coords.longitude, accuracy: Number.isFinite(coords.accuracy) ? coords.accuracy : 0, timestamp: Number.isFinite(fix.timestamp) ? fix.timestamp : Date.now() });
  }
  function requestOnce() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(read, function () {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }
  window.addEventListener('message', function (event) {
    if (event.origin !== location.origin || !event.data) return;
    if (event.data.type === 'donglvji:ready') { ready = true; hideBoot(); if (lastPosition) sendPosition(lastPosition); }
    if (event.data.type === 'donglvji:request-location') { if (lastPosition) sendPosition(lastPosition); requestOnce(); }
  });
  frame.addEventListener('load', function () { if (lastPosition) sendPosition(lastPosition); });
  frame.src = src;
  requestOnce();
  if (navigator.geolocation && typeof navigator.geolocation.watchPosition === 'function') {
    navigator.geolocation.watchPosition(read, function () {}, { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 });
  }
  setTimeout(function () { if (!ready) hideBoot(); }, 20000);
})();
</script>
</body>
</html>
